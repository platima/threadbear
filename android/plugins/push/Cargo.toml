[package]
name = "tauri-plugin-threadbear-push"
version = "0.1.0"
description = "Threadbear for Android: notifications through Firebase, sealed with the phone's own key"
edition = "2021"
# Tauri finds the plugin's Android project through this (the build script passes
# its path on to the app's build)
links = "tauri-plugin-threadbear-push"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde_json = "1"
