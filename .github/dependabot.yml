# Dependency updates for what this fork owns: the Windows and Linux desktop app
# (desktop-tauri/), the Android app (android/) and the workflows. Each ecosystem comes
# as one grouped pull request a week.
#
# Not here: the runner, the root package, the relay, the site and the Swift
# packages. They come from Mike's repository, so a version bump here would only
# conflict the next time his main is merged in. Those still get Dependabot's
# security updates (Settings, Code security), and Mike's own bumps arrive with
# his main.
#
# `cooldown` leaves a new release a week before it is proposed, so a release that
# is pulled for a fault or for malware has usually gone by then. Security
# updates ignore it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop-tauri
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Australia/Perth }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups: { desktop-npm: { patterns: ["*"] } }
    commit-message: { prefix: deps }

  - package-ecosystem: npm
    directory: /android
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Australia/Perth }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups: { android-npm: { patterns: ["*"] } }
    commit-message: { prefix: deps }

  # Tauri's crates and its npm CLI move together: a bump to one that the CI
  # (the Windows build, the Android emulator job) does not take is for me to hold.
  - package-ecosystem: cargo
    directory: /desktop-tauri/src-tauri
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Australia/Perth }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups: { desktop-cargo: { patterns: ["*"] } }
    commit-message: { prefix: deps }

  - package-ecosystem: cargo
    directory: /android/src-tauri
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Australia/Perth }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups: { android-cargo: { patterns: ["*"] } }
    commit-message: { prefix: deps }

  # The workflows pin each action to a commit with its version beside it
  # (`uses: owner/name@<sha> # v1.2.3`), which Dependabot keeps in step.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Australia/Perth }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups: { actions: { patterns: ["*"] } }
    commit-message: { prefix: ci }
