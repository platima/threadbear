name: windows

# The Windows port (docs/windows-port-plan.md): the runner's unit tests on
# Windows, and the desktop app's typecheck, tests, version check and build.
# Called by release.yml before anything is published. The files in
# runner/test/windows-known-failing.txt are reported, not enforced; the list
# shrinks as the port goes.
#
# Triggers: pushes to main and to the port's branches, and pull requests into
# main. A branch with an open pull request gets both runs; they are kept apart
# (see concurrency) so neither cancels the other and the pull request always
# ends up with a finished check.

on:
  push:
    branches: [main, 'claude/**', 'windows/**']
  pull_request:
    branches: [main]
  workflow_call:
  # By hand, against any branch: `gh workflow run windows.yml --ref <branch>`.
  # GitHub only offers it once this file has it on the default branch.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch (or an update to a pull request) cancels that
# branch's older run. A release's runs (a tag, or a manual dry run, arriving
# through workflow_call) queue instead: cancelling one would fail the release
# that called it. The group does not use github.workflow: through
# workflow_call that is the caller's name, and a group shared with the caller
# is a deadlock.
concurrency:
  group: windows-ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  runner:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runner
    env:
      # The skip count is printed in the summary of every run. Over this, a
      # warning: raise it on purpose when a test is skipped on purpose.
      SKIP_LIMIT: 280
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is what the Windows app ships (installer/node.json) and what
      # the runner's engines field asks for, so it is what CI tests on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck

      # node --test counts a file with no tests in it as one passing test, and
      # skipped tests are not failures, so a green run alone does not say
      # tests ran. This step keeps the script's exit code and adds three
      # checks of its own: the totals must show tests that passed, a file that
      # ran no tests (it shows up as a line for the file, not for a test) is
      # named in a warning, and the skip count goes in the run's summary.
      - name: Unit tests that should pass
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit-tests.log"
          set +e
          node scripts/test-windows.mjs 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # node's totals are lines like "ℹ skipped 179", sometimes in colour
          total() { sed 's/\x1b\[[0-9;]*m//g' "$log" | awk -v k="$1" '$1 == "ℹ" && $2 == k && $3 ~ /^[0-9]+$/ { n = $3 } END { print n + 0 }'; }
          tests=$(total tests); passed=$(total pass); failed=$(total fail)
          cancelled=$(total cancelled); skipped=$(total skipped)

          {
            echo "### Runner unit tests (expected to pass)"
            echo
            echo "$passed passed, $failed failed, $cancelled cancelled and **$skipped skipped**, of $tests tests."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Totals: $tests tests, $passed passed, $failed failed, $cancelled cancelled, $skipped skipped"

          if [ "$tests" -eq 0 ] || [ "$passed" -eq 0 ]; then
            echo "::error::The run reported $tests tests and $passed passed. The suite did not really run."
            status=1
          fi
          if [ "$skipped" -gt "$SKIP_LIMIT" ]; then
            echo "::warning::$skipped tests were skipped, over the $SKIP_LIMIT this workflow expects. If that is deliberate, raise SKIP_LIMIT in windows.yml."
          fi
          sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^(✔|﹣|✖) [^ ]+\.test\.ts \(' > "$RUNNER_TEMP/empty-files.txt" || true
          if [ -s "$RUNNER_TEMP/empty-files.txt" ]; then
            echo "::warning::These test files ran no tests (or did not load), which passes without testing anything: $(sed 's/^[^ ]* \([^ ]*\) .*/\1/' "$RUNNER_TEMP/empty-files.txt" | tr '\n' ' ')"
          fi
          exit "$status"

      # The known-failing list is a report: a file on it that still fails does
      # not fail the run. Each file runs on its own, so one that passes now
      # can be named (a warning on the run, and in its summary) rather than
      # staying on the list unnoticed. A list that names a file that does not
      # exist is an error (the script exits 2), not a pass.
      - name: Unit tests still known to fail
        shell: bash
        run: |
          list=test/windows-known-failing.txt
          files=$(sed 's/\r//; s/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//' "$list" | grep -v '^$' || true)
          if [ -z "$files" ]; then
            echo "$list is empty: no file is excused."
            printf '### Known-failing list\n\nEmpty: no file is excused.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          now=""
          still=""
          for f in $files; do
            echo "::group::$f"
            set +e
            node scripts/test-windows.mjs "$f"
            rc=$?
            set -e
            echo "::endgroup::"
            case $rc in
            0)
              now="$now $f"
              echo "::warning file=runner/$list,title=Listed file now passes::$f passes on Windows. Take it off runner/$list."
              ;;
            2)
              echo "::error file=runner/$list::The known-failing list is not valid (see above)."
              exit 2
              ;;
            *) still="$still $f" ;;
            esac
          done
          {
            echo "### Known-failing list"
            echo
            echo "Still failing:${still:- none}"
            echo
            echo "**Now passing, take off the list:**${now:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Still failing:${still:- none}"
          echo "Now passing:${now:- none}"

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - run: npm ci
      # The UI imports the runner's protocol types, so the runner's packages
      # have to be there for the typecheck to see them.
      - run: npm ci
        working-directory: runner
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # One version number, repeated in four files: they have to agree.
      - run: node scripts/version.mjs --check
      - name: The shell compiles
        working-directory: desktop-tauri/src-tauri
        run: cargo check --locked
      # The shell's own tests (lib.rs). Some start copies of Node, set up above, in a
      # folder of the test's own as stand-ins for the bridge, and end them by handle.
      - name: The shell's tests
        working-directory: desktop-tauri/src-tauri
        run: cargo test --locked
