name: posix-check

# Throwaway: runs the runner's tests on a Mac and on Linux, so a branch can be
# compared with upstream's main. Lives only on tmp/posix-* branches.

on:
  push:
    branches: ['tmp/posix-**']

permissions:
  contents: read

jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/t.log" 2>&1
          echo "npm test exit code: $?"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/t.log" > "$RUNNER_TEMP/plain.log"
          echo "TOTALS:"
          grep -E '^ℹ (tests|pass|fail|cancelled|skipped) ' "$RUNNER_TEMP/plain.log"
          echo "FAILING-TESTS-BEGIN"
          awk '/^✖ failing tests:/{f=1} f && /^✖ /{print}' "$RUNNER_TEMP/plain.log" | sed -E 's/ \([0-9.]+ms\)$//' | sort -u
          echo "FAILING-TESTS-END"
          exit 0
