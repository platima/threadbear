name: posix-check

# Throwaway: runs the runner's tests on a Mac and on Linux, so a branch can be
# compared with upstream's main. Lives only on tmp/posix-* branches.

on:
  push:
    branches: ['tmp/posix-**']

permissions:
  contents: read

jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - name: proc tests, three times, in full
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== run $i"
            node --test --test-reporter=spec --test-timeout=300000 --test-force-exit test/unit/proc.test.ts 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\s*$' | cut -c1-300 | head -150
          done
          exit 0
