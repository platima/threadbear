name: android

# Builds the Android app (android/, docs/android.md) on GitHub's Ubuntu image,
# which already has the Android SDK, an NDK and a JDK, so nobody needs
# Android Studio to get an APK.
#
# The APK is a release build, built unsigned by the `apk` job and signed by the
# `sign` job (android/scripts/sign-apk.sh). The release key is the four
# ANDROID_KEYSTORE_* secrets of the repository's `release` environment, so only
# a job that runs in that environment can read it, and the environment
# allows only a release tag (v*) or `main`. When this workflow runs on its own,
# `sign` runs in it for a rehearsal started by hand from main. For anything
# else, a push to a branch or a pull request, it runs with no environment,
# never sees the key, and signs with a key made for the run: enough to install
# it once, and never the key that makes a phone take a build as an update.
#
# A release does not use `sign`. A job of a called workflow does not receive the
# `release` environment's secrets (checked on 9 Nov: this same job read them
# when it ran on its own, and got nothing when release.yml called it), so
# release.yml passes `caller_signs`, which skips `sign`, and signs the unsigned
# APK itself in a job of its own, in the same environment.
#
# Notifications go through Firebase (android/plugins/push). The app gets its
# Firebase project from the ANDROID_GOOGLE_SERVICES_JSON secret, the contents of
# the project's google-services.json: without it the app builds with no
# notifications, as a fork or a pull request does. With it and the
# FIREBASE_SERVICE_ACCOUNT secret (a service account key's contents), the
# emulator job also sends the app a sealed notification and looks for it in
# the notification shade. Those two need the repository's secrets, so a pull
# request from a fork skips that part.
#
# A second job runs the app once on an emulator.
#
# It runs on changes to the app or to the website it wraps, by hand, and as a
# part of release.yml.

on:
  push:
    branches: [main, 'android/**']
    paths: ['android/**', 'web/**', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The release tag the APK is named for (v0.1.0), when a release calls this"
        type: string
        default: ''
      caller_signs:
        description: "true when the caller signs the unsigned APK itself, with the release key, so `sign` is skipped"
        type: boolean
        default: false
    secrets:
      ANDROID_GOOGLE_SERVICES_JSON:
        required: false
    outputs:
      signed:
        description: "true when `sign` signed the APK with the release key, false when with a key made for the run; empty when the caller signs"
        value: ${{ jobs.sign.outputs.signed }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - name: Website and shell dependencies
        run: |
          npm ci
          npm ci --prefix android
      - name: The website's checks
        run: |
          npm run web:typecheck
          npm run web:test
      - name: Rust targets for the phone
        run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Where Java and the NDK are
        # The image keeps them under other names (Java 17 and the NDK it ships);
        # Tauri looks for JAVA_HOME and NDK_HOME.
        run: |
          echo "SDK: $ANDROID_HOME"
          echo "NDKs: $ANDROID_NDK_HOME $ANDROID_NDK_LATEST_HOME $ANDROID_NDK_ROOT"
          ls "$ANDROID_HOME/ndk" || true
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      # Gradle's own downloads (its distribution, Kotlin, the libraries) come from
      # servers that answered 504 for hours on 8 Nov. Once a build has worked they
      # are kept, so the next one does not need them again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-phone-${{ hashFiles('android/src-tauri/Cargo.lock', 'android/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-phone-
      - name: The Firebase project, when the repository has one
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/plugins/push/android/src/main/assets
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/plugins/push/android/src/main/assets/google-services.json
            node -e "const j = JSON.parse(require('fs').readFileSync('android/plugins/push/android/src/main/assets/google-services.json', 'utf8')); const n = j.client.map((c) => c.client_info.android_client_info.package_name); if (!n.includes('com.tinkerware.threadbear')) { console.error('::error::google-services.json is not for com.tinkerware.threadbear, but for ' + n.join(', ')); process.exit(1); } console.log('The app has a Firebase project')"
          else
            echo "No ANDROID_GOOGLE_SERVICES_JSON: the app is built without notifications"
          fi
      - name: Make the Gradle project
        working-directory: android
        run: |
          npx tauri android init --ci
          # The wrapper gives its download of Gradle 10 seconds, which GitHub's
          # downloads missed more than once on 8 Nov (timeouts and 504s).
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$props"; then sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$props"; else echo 'networkTimeout=120000' >> "$props"; fi
          grep networkTimeout "$props"
          # The bear, not the Tauri logo the template makes (scripts/apply-icons.sh)
          sh scripts/apply-icons.sh
      - name: Build the release APK
        working-directory: android
        # Up to three tries: the build downloads Gradle, Kotlin and the libraries
        # from servers that now and then answer 504. A release build comes out
        # unsigned, and is signed by the next job.
        run: |
          for i in 1 2 3 4 5; do
            npx tauri android build --apk --target aarch64 armv7 && exit 0
            echo "Attempt $i failed"
            sleep $((i * 45))
          done
          exit 1
      - name: Keep the unsigned APK for the signing job
        run: |
          set -eu
          unsigned=$(find android/src-tauri/gen/android -name '*-unsigned.apk' -print -quit)
          [ -n "$unsigned" ] || { echo "::error::The build made no unsigned APK"; find android/src-tauri/gen/android -name '*.apk'; exit 1; }
          mkdir -p unsigned
          cp "$unsigned" unsigned/app-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadbear-android-unsigned
          path: unsigned/app-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  # Signs it. For a rehearsal started by hand from main it runs in the `release`
  # environment, which holds the release key and only lets main and release tags
  # in; for anything else it has no environment and no key (the secrets are
  # blanked in the step, so a copy of the key left in the repository's own
  # secrets could not be read either), and a key made for the run signs it. The
  # unsigned APK is all it takes from the build, and it builds nothing. A release
  # signs the APK in release.yml instead (see the top of this file).
  sign:
    if: ${{ !inputs.caller_signs }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'release' || '' }}
    env:
      # The same test as the environment's, for the steps: true where this job is in
      # the release environment
      RELEASE_REF: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: threadbear-android-unsigned
          path: unsigned
      - name: Sign it
        id: sign
        env:
          # Blanked by the expression itself unless this is a release or a rehearsal
          # from main, so no step or child process of a branch run ever holds the
          # key, even if a copy is left in the repository's own secrets
          ANDROID_KEYSTORE_BASE64: ${{ env.RELEASE_REF == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_REF == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_REF == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_REF == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          [ "$RELEASE_REF" = true ] || echo "Not a release or a rehearsal from main: signing with a key made for this run"
          mkdir -p out
          name="threadbear-${VERSION:-dev}-android.apk"
          sh android/scripts/sign-apk.sh unsigned/app-unsigned.apk "out/$name" | tee "$RUNNER_TEMP/sign.log"
          echo "signed=$(tail -n 1 "$RUNNER_TEMP/sign.log" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          (cd out && sha256sum --text "$name" > "$name.sha256" && cat "$name.sha256")
      # What a release would say about this APK (release.yml runs the same check
      # on the whole set): that the signature verifies, and that a key made for
      # one run is refused. The other files of a release are missing here, and
      # their errors are not what is looked at.
      - name: The release check reads the APK's signature
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir check
          cp out/* check/
          sh installer/validate-release-assets.sh check "${VERSION:-dev}" > check.log 2>&1 || true
          grep -i 'android' check.log
          if [ "$SIGNED" = true ]; then
            grep -q 'has a valid signature, not a run' check.log
          else
            grep -q 'signed with a key made for one run' check.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadbear-android-apk
          path: |
            out/*.apk
            out/*.apk.sha256
          if-no-files-found: error

  # The app run once on an emulator, as there is no phone here: a release build
  # for the emulator's CPU (x86_64), signed with a key of its own, installed,
  # opened, and shown a pairing link. The pictures it takes are kept, and the
  # run fails if the app crashes or the page never comes up. It is a check that
  # the release build (shrunk, as a phone gets it) starts and takes the link, not
  # a test of a real phone (a camera, the notification shade, the back button).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - name: Website and shell dependencies
        run: |
          npm ci
          npm ci --prefix android
      - name: Rust target for the emulator
        run: rustup target add x86_64-linux-android
      - name: Where Java and the NDK are
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-emulator-${{ hashFiles('android/src-tauri/Cargo.lock', 'android/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-emulator-
      # With both Firebase secrets this copy of the app is built to be tested:
      # given a push key of its own to seal against (the key is made here, not
      # kept anywhere) and told to log its Firebase token, so the check below
      # knows where to send. The app people install is built without either
      # (android/plugins/push/android/build.gradle.kts).
      - name: The Firebase project, and a key for the check
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/plugins/push/android/src/main/assets
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/plugins/push/android/src/main/assets/google-services.json
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            key=$(openssl rand -base64 32)
            echo "::add-mask::$key"
            echo "TB_PUSH_TEST_KEY=$key" >> "$GITHUB_ENV"
            echo "TB_PUSH_LOG_TOKEN=1" >> "$GITHUB_ENV"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "Without both Firebase secrets the emulator check leaves out notifications"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make the Gradle project and build for x86_64
        working-directory: android
        run: |
          npx tauri android init --ci
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$props"; then sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$props"; else echo 'networkTimeout=120000' >> "$props"; fi
          sh scripts/apply-icons.sh
          for i in 1 2 3 4 5; do
            npx tauri android build --apk --target x86_64 && exit 0
            echo "Attempt $i failed"
            sleep $((i * 45))
          done
          exit 1
      - name: Sign it with a key of its own
        # No ANDROID_KEYSTORE_* here, on purpose: the emulator never needs the release key.
        run: |
          set -eu
          unsigned=$(find android/src-tauri/gen/android -name '*-unsigned.apk' -print -quit)
          [ -n "$unsigned" ] || { echo "::error::The build made no unsigned APK"; exit 1; }
          sh android/scripts/sign-apk.sh "$unsigned" emulator.apk
      - name: Let the emulator use the hardware's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # Every step that waits has a limit of its own, and says where it is, so a
      # hang fails in minutes with its log, not after the job's hour with nothing.
      - name: An emulator
        timeout-minutes: 25
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-34;google_apis;x86_64"
          say() { echo "$(date -u +%H:%M:%S) $*"; }
          say "licences"
          yes | timeout 120 "$sdk/sdkmanager" --licenses > /dev/null || true
          say "the system image"
          timeout 900 "$sdk/sdkmanager" "emulator" "platform-tools" "$image" | tail -n 5
          say "the virtual device"
          # One place for the device, for the tool that makes it and the emulator
          # that finds it (they looked in different ones the first time).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd --force -n ci -k "$image" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds
          say "starting the emulator"
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader_indirect -memory 3072 -cores 2 > emulator.log 2>&1 &
          emulator_pid=$!
          booted=0
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then say "the emulator stopped"; break; fi
            if [ "$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
            [ $((i % 6)) -ne 0 ] || say "still booting ($(adb devices | tail -n +2 | tr '\n' ' '))"
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "The emulator did not finish booting. Its log:"
            tail -n 60 emulator.log || true
            exit 1
          fi
          say "booted: Android API $(adb shell getprop ro.build.version.sdk)"
      - name: It installs, opens and takes a pairing link
        timeout-minutes: 10
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          command -v convert > /dev/null || sudo apt-get install -y --no-install-recommends imagemagick
          ls -l emulator.apk
          adb install -r emulator.apk
          adb shell pm list packages com.tinkerware.threadbear
          mkdir -p shots
          adb logcat -c
          # Opened from the launcher, as a person would: the first screen asks for a link
          adb shell monkey -p com.tinkerware.threadbear -c android.intent.category.LAUNCHER 1
          sleep 25
          adb exec-out screencap -p > shots/1-first-screen.png
          # The screen's text, when the page's content shows in it (a WebView often
          # does not, so what is checked below is the picture)
          adb exec-out uiautomator dump /dev/tty > shots/1-first-screen.xml || true
          # A pairing link, as the phone's camera would hand it over
          # The whole command goes to the phone's shell as one string, so its & stays
          # in the quotes (outside them it ended the command and started another).
          adb shell "am start -W -a android.intent.action.VIEW -d 'threadbear://pair?url=https%3A%2F%2Fdemo.example.test&token=abc123' com.tinkerware.threadbear"
          sleep 10
          adb exec-out screencap -p > shots/2-pairing-link.png
          adb exec-out uiautomator dump /dev/tty > shots/2-pairing-link.xml || true
          adb logcat -d > shots/logcat.txt
          # The copy built for the check logs its Firebase token, which is no
          # use without the project's key, but is not for an artifact either
          sed -i 's/test token .*/test token (removed)/' shots/logcat.txt
          # What the shell and the page said about the link (never the link itself)
          echo "--- the app's own lines:"
          grep -E 'RustStdoutStderr: threadbear' shots/logcat.txt || echo "(none)"
          echo "---"
          adb shell pidof com.tinkerware.threadbear
          # A crash of this app only: Android's own uiautomator tool (the dump above)
          # can die on an emulator with "Bad file descriptor", and that is not the app
          # (it failed the rc.2 release run once, with the app running and the link taken)
          if grep -A 3 'FATAL EXCEPTION' shots/logcat.txt | grep -q 'Process: com.tinkerware.threadbear'; then grep -A 20 'FATAL EXCEPTION' shots/logcat.txt | head -60; exit 1; fi
          # The page comes up: a screen that is not the blank one (a blank WebView is
          # one colour, which compresses to a few KB)
          test "$(wc -c < shots/1-first-screen.png)" -gt 40000
          # The link was taken: the page asked where the token goes, so the screen
          # is not the one it was, below the status bar's clock. Before the page
          # listened for links properly this was the same picture twice.
          if grep -q 'demo.example.test' shots/2-pairing-link.xml; then
            echo "The screen's text names the address from the link"
          else
            convert shots/1-first-screen.png -crop 1080x2000+0+200 +repage shots/1-below-clock.png
            convert shots/2-pairing-link.png -crop 1080x2000+0+200 +repage shots/2-below-clock.png
            if cmp -s shots/1-below-clock.png shots/2-below-clock.png; then
              echo "::error::The pairing link changed nothing on the screen: the app did not take it"
              exit 1
            fi
            echo "The screen changed after the pairing link"
          fi
      # The first screen's "Scan the code", tapped as a person would. It failed on a
      # phone with "Attempt to invoke virtual method ... getClass() on a null object
      # reference" because the release build's shrinker (R8) had removed what ML Kit
      # starts itself from by name (android/plugins/push/android/consumer-rules.pro),
      # and neither the build nor the checks above ever tapped it. The emulator's image
      # has Google Play services but no camera to speak of, so what is checked is that
      # the scanner is asked for and answers in its own words, or opens, and that
      # nothing in the app's own start-up was left unable to start.
      - name: Scan the code is tapped
        timeout-minutes: 10
        run: |
          set -u
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pkg=com.tinkerware.threadbear
          adb logcat -c
          # From the launcher again, so it is the first screen (the pairing link above was
          # never accepted)
          adb shell am force-stop "$pkg"
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          sleep 25
          adb exec-out screencap -p > shots/3-scan-before.png
          # The button's place: from the screen's text when the page's content shows in it
          # (the first dump of a WebView often holds only the WebView; a later one has the
          # page), else where it is on this device's first screen (1080 by 2400)
          x=540; y=959
          found=""
          for i in 1 2 3 4; do
            adb exec-out uiautomator dump /dev/tty > shots/3-scan-before.xml || true
            found=$(node -e 'const t = require("fs").readFileSync("shots/3-scan-before.xml", "utf8"); const m = /text="Scan the code"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"/.exec(t); if (m) console.log(Math.round((+m[1] + +m[3]) / 2) + " " + Math.round((+m[2] + +m[4]) / 2));')
            if [ -n "$found" ]; then x=${found% *}; y=${found#* }; echo "The button is in the screen's text, at $x,$y"; break; fi
            sleep 3
          done
          [ -n "$found" ] || echo "The button is not in the screen's text: tapping where it was on the first picture, $x,$y"
          adb shell input tap "$x" "$y"
          sleep 10
          adb exec-out screencap -p > shots/3-scan-after.png
          adb exec-out uiautomator dump /dev/tty > shots/3-scan-after.xml || true
          adb logcat -d > shots/logcat-scan.txt
          echo "--- what the screen says now:"
          grep -o 'text="[^"]\+"' shots/3-scan-after.xml | head -30 || true
          echo "--- the app's lines, and Google's, about the scanner:"
          grep -E 'ThreadbearPush|AndroidRuntime|FATAL|ComponentDiscovery|Invalid component|MlKit|codescanner|barcode' shots/logcat-scan.txt | cut -c1-320 | head -100 || true
          echo "---"
          # Away from the scanner (if it opened) and the app
          adb shell input keyevent KEYCODE_BACK || true
          sleep 2
          adb shell am force-stop "$pkg"
      # The notification a thread that needs the person becomes, end to end but
      # for the backend: sealed with the app's key as the backend seals it, sent
      # through Firebase with the service account (as the relay does), to an
      # app that is in the background, and found in the notification shade with
      # the sealed words opened. A delivery through Google can be slow on an
      # emulator, so it waits up to three minutes.
      - name: A notification arrives while the app is in the background
        if: steps.firebase.outputs.push == 'true'
        timeout-minutes: 15
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pkg=com.tinkerware.threadbear
          adb shell pm grant "$pkg" android.permission.POST_NOTIFICATIONS
          adb logcat -c
          # Started again from the launcher, so the app says which token it has
          adb shell am force-stop "$pkg"
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          token=""
          for i in $(seq 1 40); do
            token=$(adb logcat -d -s ThreadbearPush:I | sed -n 's/.*test token //p' | tail -n 1 | tr -d '\r')
            [ -z "$token" ] || break
            sleep 5
          done
          if [ -z "$token" ]; then
            echo "::error::The app gave no Firebase token in 200 seconds"
            adb logcat -d | grep -E 'ThreadbearPush|FirebaseApp|FirebaseMessaging|FATAL' | sed 's/test token .*/test token (removed)/' | tail -n 40
            exit 1
          fi
          echo "::add-mask::$token"
          echo "The app has a Firebase token"
          # Away from the app, and its process stopped as Android stops an idle
          # one (not a force stop, which keeps Android from delivering anything)
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb shell am kill "$pkg" || true
          title="Emulator check $GITHUB_RUN_ID"
          body="Sealed by the server, opened on the phone"
          node android/scripts/send-test-push.mjs "$token" "$TB_PUSH_TEST_KEY" "$title" "$body"
          found=0
          for i in $(seq 1 36); do
            if adb shell dumpsys notification --noredact | grep -q "$title"; then found=1; break; fi
            sleep 5
          done
          adb exec-out screencap -p > shots/3-after-push.png || true
          adb logcat -d | sed 's/test token .*/test token (removed)/' > shots/logcat-push.txt
          echo "--- the app's lines about it:"
          grep ThreadbearPush shots/logcat-push.txt || echo "(none)"
          echo "---"
          if [ "$found" != 1 ]; then
            echo "::error::No notification appeared within three minutes of Firebase accepting the message"
            exit 1
          fi
          echo "The notification is in the shade"
          adb shell dumpsys notification --noredact | grep -q "$body"
          echo "and it carries the sealed words, opened"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: threadbear-android-emulator
          path: |
            shots
            emulator.log
          if-no-files-found: warn
