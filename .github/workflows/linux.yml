name: linux

# The Linux desktop app (docs/linux.md): the shell built on Ubuntu, packaged with its
# own Node and the runner into threadbear-v<version>-linux-<arch>.tar.gz
# (installer/linux/stage.mjs), and shown to start. x64 on GitHub's x64 Ubuntu,
# arm64 on its Arm one, each building natively, so nothing is cross-compiled.
#
# It runs on changes to what goes in the package, and by hand. It publishes
# nothing: the tarball is an artifact of the run.

on:
  push:
    branches: [main, 'linux/**']
    paths: ['desktop/**', 'runner/**', 'installer/linux/**', 'installer/node.json', 'installer/make-notices.mjs', 'docs/guide.md', 'docs/protocol.md', 'docs/on-your-mac.md', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            runner/package-lock.json
            desktop/package-lock.json
      - name: System libraries the shell is built from
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config xz-utils xvfb
      - name: Dependencies
        run: |
          npm ci --prefix runner
          npm ci --prefix desktop
      - name: The runner's checks that matter here
        working-directory: runner
        run: |
          npm run typecheck
          node --test test/unit/install-linux.test.ts test/unit/agent-sdk.test.ts test/unit/platform.test.ts
      - name: The desktop UI's checks
        working-directory: desktop
        run: |
          npm run typecheck
          npm test
      - name: Build the shell
        working-directory: desktop
        run: npx tauri build --no-bundle
      - name: Package
        run: node installer/linux/stage.mjs --arch ${{ matrix.arch }} --shell desktop/src-tauri/target/release/threadbear-desktop
      - name: The .deb
        run: node installer/linux/deb.mjs --arch ${{ matrix.arch }}
      - name: What was made
        run: |
          ls -l build/linux-${{ matrix.arch }}
          cat build/linux-${{ matrix.arch }}/*.sha256
          tar -tzf build/linux-${{ matrix.arch }}/*.tar.gz | head -40
          dpkg-deb --info build/linux-${{ matrix.arch }}/*.deb
          dpkg-deb --contents build/linux-${{ matrix.arch }}/*.deb | grep -v ' opt/threadbear/\(runner\|desktop\|node\|docs\)/' | head -40
      - name: It starts
        run: |
          set -eu
          dir=$(mktemp -d)
          tar -xzf build/linux-${{ matrix.arch }}/*.tar.gz -C "$dir"
          app=$(echo "$dir"/threadbear-v*-linux-${{ matrix.arch }})
          "$app/node/bin/node" --version
          # The runner, from the package's own Node and packages: tb answers.
          HOME="$dir/home" "$app/node/bin/node" "$app/runner/bin/tb" --help | head -5
          # The installer script, without touching this machine's systemd.
          HOME="$dir/home" "$app/node/bin/node" "$app/runner/scripts/install-linux.mjs" --dry-run
          # The window, under a virtual screen: it is still there after 15 seconds
          # (timeout ends it with 124), and the bridge it started answered.
          # (A session bus for the single-instance check, and software drawing, as a
          # runner has no GPU.)
          export HOME="$dir/home" THREADBEAR_NO_RUNNER_OFFER=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$HOME"
          set +e
          timeout 15 dbus-run-session -- xvfb-run -a "$app/threadbear-desktop" > "$dir/app.log" 2>&1
          code=$?
          set -e
          cat "$dir/app.log"
          test "$code" = 124
      # The .deb is installed and used as an ordinary user would, then removed.
      # Its files are root's, so the app running as this (unprivileged) user also
      # shows nothing under /opt has to be written to.
      - name: The .deb installs, starts and goes
        run: |
          set -eu
          deb=$(echo build/linux-${{ matrix.arch }}/*.deb)
          test "$(dpkg-deb --field "$deb" Architecture)" = "$(dpkg --print-architecture)"
          # A pre-release sorts before the release it leads to
          version=$(dpkg-deb --field "$deb" Version)
          dpkg --compare-versions "0.1.0~rc.1" lt "0.1.0"
          echo "Package version: $version"
          sudo apt-get install -y --no-install-recommends "./$deb"
          dpkg -L threadbear | head -12
          test -x /opt/threadbear/threadbear-desktop
          test "$(readlink -f /usr/bin/threadbear-desktop)" = /opt/threadbear/threadbear-desktop
          test -f /usr/share/applications/threadbear.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/threadbear.png
          test -f /usr/share/doc/threadbear/copyright
          test ! -e /opt/threadbear/install.sh
          # Nothing in the package is writable by anyone but root
          test -z "$(find /opt/threadbear -not -type l -perm /022 -print -quit)"
          desktop-file-validate /usr/share/applications/threadbear.desktop || true
          /opt/threadbear/node/bin/node --version
          home=$(mktemp -d)
          HOME="$home" /opt/threadbear/node/bin/node /opt/threadbear/runner/scripts/install-linux.mjs --dry-run
          export HOME="$home" THREADBEAR_NO_RUNNER_OFFER=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          set +e
          timeout 15 dbus-run-session -- xvfb-run -a /usr/bin/threadbear-desktop > "$home/app.log" 2>&1
          code=$?
          set -e
          cat "$home/app.log"
          test "$code" = 124
          sudo apt-get remove -y threadbear
          test ! -e /opt/threadbear/threadbear-desktop
          test ! -e /usr/bin/threadbear-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadbear-linux-${{ matrix.arch }}
          path: |
            build/linux-${{ matrix.arch }}/*.tar.gz
            build/linux-${{ matrix.arch }}/*.tar.gz.sha256
            build/linux-${{ matrix.arch }}/*.deb
            build/linux-${{ matrix.arch }}/*.deb.sha256
          if-no-files-found: error
